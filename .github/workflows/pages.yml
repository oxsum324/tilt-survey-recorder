name: Test and deploy tilt survey
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tilt-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      TILT_CI_EVIDENCE_SCOPE: github-actions
    steps:
      - name: Initialize evidence before checkout or installation
        id: evidence_start
        env:
          TILT_CI_EVIDENCE_ROOT: ${{ runner.temp }}/tilt-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # BEGIN_CI_EVIDENCE_BOOTSTRAP
          $ErrorActionPreference = 'Stop'
          $root = $env:TILT_CI_EVIDENCE_ROOT
          if (Test-Path -LiteralPath $root) { throw 'Preserve previous CI evidence' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $record = [ordered]@{ scope = $env:TILT_CI_EVIDENCE_SCOPE; commit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; startedUtc = [DateTime]::UtcNow.ToString('o'); state = 'initialized' }
          [IO.File]::WriteAllText((Join-Path $root 'bootstrap.json'), ($record | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TILT_CI_EVIDENCE_ROOT=$root" + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          # END_CI_EVIDENCE_BOOTSTRAP
      - uses: actions/checkout@v6
        id: checkout
      - name: Install pinned workflow semantic validator with evidence
        id: install_actionlint
        run: ./tests/ci/run-command.ps1 -Name install_actionlint -Executable ./tests/ci/install-actionlint.ps1; exit $LASTEXITCODE
      - uses: actions/setup-node@v4
        id: node_setup
        with:
          node-version: '22'
          cache: npm
      - name: Validate workflow semantics and rejection controls
        id: workflow_semantics
        run: ./tests/ci/run-command.ps1 -Name workflow_semantics -Executable npm.cmd -Arguments @('run', 'test:workflow'); exit $LASTEXITCODE
      - uses: actions/setup-python@v5
        id: python_setup
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/desktop/requirements.txt
      - name: Install npm dependencies with evidence
        id: npm_install
        run: ./tests/ci/run-command.ps1 -Name npm_install -Executable npm.cmd -Arguments @('ci', '--ignore-scripts'); exit $LASTEXITCODE
      - name: Install Python dependencies with evidence
        id: python_install
        run: ./tests/ci/run-command.ps1 -Name python_install -Executable python -Arguments @('-m', 'pip', 'install', '-r', 'tests/desktop/requirements.txt'); exit $LASTEXITCODE
      - name: Install both browsers with evidence
        id: browser_install
        run: ./tests/ci/run-command.ps1 -Name browser_install -Executable npx.cmd -Arguments @('playwright', 'install', 'chrome', 'msedge'); exit $LASTEXITCODE
      - name: Install verified Traditional Chinese font for PDF checks
        id: font_install
        run: ./tests/ci/run-command.ps1 -Name font_install -Executable ./tests/desktop/install-ci-font.ps1; exit $LASTEXITCODE
      # Independent test failures remain failures; run later suites for complete evidence.
      # Every failed step still fails checks; publication gates remain unchanged.
      - name: Regress capture of browser failures before page cleanup
        id: browser_diagnostic_regressions
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name browser_diagnostic_regressions -Executable npm.cmd -Arguments @('run', 'test:browser-evidence'); exit $LASTEXITCODE
      - name: Regress CI evidence failure scenarios
        # Trace completion regressions are separate from the fourteen existing diagnostics.
        id: ci_regressions
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name ci_regressions -Executable npm.cmd -Arguments @('run', 'test:ci-evidence'); exit $LASTEXITCODE
      - name: Regress single trace export deadlines and execution provenance
        id: trace_completion
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name trace_completion -Executable npm.cmd -Arguments @('run', 'test:trace-completion'); exit $LASTEXITCODE
      - name: Regress export diagnostics, offline worker update boundary and bounded profile cleanup
        id: reliability
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name reliability -Executable npm.cmd -Arguments @('run', 'test:reliability'); exit $LASTEXITCODE
      - name: Regress isolated final receipt and worker observer write failures
        id: evidence_io
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name evidence_io -Executable npm.cmd -Arguments @('run', 'test:evidence-io'); exit $LASTEXITCODE
      - name: Regress late rename publication and native resource diagnostics
        # Retain the original diagnostics and assertion suites.
        id: publication
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name publication -Executable npm.cmd -Arguments @('run', 'test:publication'); exit $LASTEXITCODE
      - name: Data tests (92)
        id: data
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name data -Executable npm.cmd -Arguments @('test'); exit $LASTEXITCODE
      - name: Existing browser tests (101)
        id: browser
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name browser -Executable npm.cmd -Arguments @('run', 'test:browser'); exit $LASTEXITCODE
      - name: Build local site at the tested commit
        id: site_build
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name site_build -Executable node -Arguments @('build-site.mjs'); exit $LASTEXITCODE
      - name: Regress old V0.4.2 upgrades and first-navigation evidence
        id: release_regressions
        if: ${{ !cancelled() && steps.site_build.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name release_regressions -Executable npm.cmd -Arguments @('run', 'test:release'); exit $LASTEXITCODE
      - name: Chrome and Edge desktop matrix (8 scenarios, 80 grouped checks)
        # Publication checks execute before deploy on main; live verification is a branch/PR check.
        # Record actual published main separately from the candidate source under test.
        id: desktop
        if: ${{ !cancelled() && steps.site_build.outcome == 'success' }}
        run: ./tests/ci/run-command.ps1 -Name desktop -Executable npm.cmd -Arguments @('run', 'test:desktop', '--', 'ci-${{ github.run_id }}-${{ github.run_attempt }}'); exit $LASTEXITCODE
      - name: Verify published main SVG maps and basic functions without deployment
        if: ${{ !cancelled() && steps.font_install.outcome == 'success' && github.ref != 'refs/heads/main' }}
        id: live_release
        run: ./tests/ci/run-command.ps1 -Name live_release -Executable npm.cmd -Arguments @('run', 'test:live'); exit $LASTEXITCODE
      - name: Finalize evidence even when checkout or setup failed
        id: evidence_finish
        if: always()
        env:
          TILT_CI_EVIDENCE_ROOT: ${{ runner.temp }}/tilt-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TILT_CI_STEPS: ${{ toJSON(steps) }}
        run: |
          # BEGIN_CI_EVIDENCE_FINALIZE
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath($env:TILT_CI_EVIDENCE_ROOT).TrimEnd([char[]]'\/')
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $steps = $env:TILT_CI_STEPS | ConvertFrom-Json
          $summary = [ordered]@{ scope = $env:TILT_CI_EVIDENCE_SCOPE; commit = $env:GITHUB_SHA; runId = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; finishedUtc = [DateTime]::UtcNow.ToString('o'); bootstrapPresent = (Test-Path -LiteralPath (Join-Path $root 'bootstrap.json')); steps = $steps; artifactUpload = 'Not executed yet; consult the GitHub job for upload status' }
          [IO.File]::WriteAllText((Join-Path $root 'summary.json'), ($summary | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Name -ne 'sha256.json' } | ForEach-Object { [ordered]@{ file = $_.FullName.Substring($root.Length + 1).Replace('\', '/'); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          [IO.File]::WriteAllText((Join-Path $root 'sha256.json'), (ConvertTo-Json -InputObject $files -Depth 8), [Text.UTF8Encoding]::new($false))
          # END_CI_EVIDENCE_FINALIZE
      - name: Preserve test evidence including failed attempts
        id: artifact_upload
        if: always()
        env:
          TILT_CI_EVIDENCE_ROOT: ${{ runner.temp }}/tilt-ci-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@v4
        with:
          name: tilt-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TILT_CI_EVIDENCE_ROOT }}/
            output/
            test-results/
            _site/deploy-manifest.json
          if-no-files-found: error
          retention-days: 30
  build:
    # Branch and PR events run checks only. Publication always requires main and passing checks.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node build-site.mjs
        env:
          TILT_PRIVATE_DENYLIST: ${{ secrets.TILT_PRIVATE_DENYLIST }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested files
        id: deployment
        uses: actions/deploy-pages@v4

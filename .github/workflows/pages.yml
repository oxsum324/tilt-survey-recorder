name: Test and deploy tilt survey
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tilt-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/desktop/requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tests/desktop/requirements.txt
      - run: npx playwright install chrome msedge
      - name: Install verified Traditional Chinese font for PDF checks
        run: ./tests/desktop/install-ci-font.ps1
      - name: Data tests (92)
        run: |
          New-Item -ItemType Directory -Force output/ci | Out-Null
          npm test 2>&1 | Tee-Object -FilePath output/ci/data.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing browser tests (101)
        run: |
          npm run test:browser 2>&1 | Tee-Object -FilePath output/ci/browser.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build local site at the tested commit
        run: node build-site.mjs
      - name: Chrome and Edge desktop matrix (8 scenarios, 80 grouped checks)
        run: |
          npm run test:desktop -- ci-${{ github.run_id }}-${{ github.run_attempt }} 2>&1 | Tee-Object -FilePath output/ci/desktop.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tilt-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            test-results/
            _site/deploy-manifest.json
          if-no-files-found: error
          retention-days: 30
  build:
    # Branch and PR events run checks only. Publication always requires main and passing checks.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node build-site.mjs
        env:
          TILT_PRIVATE_DENYLIST: ${{ secrets.TILT_PRIVATE_DENYLIST }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested files
        id: deployment
        uses: actions/deploy-pages@v4

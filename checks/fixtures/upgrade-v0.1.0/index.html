<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153e43"><meta name="description" content="傾斜測量現場紀錄、原始讀數與 A4 成果表，資料保存在本機。"><title>傾斜測量紀錄 V0.1.0</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="app-header"><div class="brand"><img src="./icon.svg" alt="" width="40" height="40"><div><h1>傾斜測量紀錄 <small>V0.1.0</small></h1><p>第一期測試版 · 從讀數到成果，每筆都可追溯</p></div></div><div class="header-status"><span id="saveStatus" role="status">載入本機案件…</span><span id="offlineStatus">離線準備中</span></div></header>
<div class="shell"><aside class="sidebar"><nav aria-label="工作流程"><button data-tab="case" class="active"><span>01</span>案件與表頭</button><button data-tab="facades"><span>02</span>立面參數</button><button data-tab="readings"><span>03</span>測點與讀數</button><button data-tab="reports"><span>04</span>成果與輸出</button></nav><div class="device-note"><b>資料保存在此裝置</b><p>不同裝置不會同步。離開現場前，請匯出完整案件檔。</p><button data-action="export">匯出案件檔</button><button data-action="import">匯入案件檔</button></div><div class="phase-note">照片標註、佈設圖、強光模式與螢幕常亮，依派工規格安排在後續期別。</div></aside>
<main id="main"><div id="notice" role="status" aria-live="polite" hidden></div><div id="workspace"></div></main></div>
<input id="importFile" type="file" accept=".tiltsurvey,.json,application/json" hidden>
<dialog id="actionDialog"><form method="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><label id="reasonLabel" hidden>更正原因<textarea id="dialogReason" rows="3" maxlength="1000" placeholder="請說明更正的原因"></textarea></label><div id="dialogButtons" class="button-row"></div></form></dialog>
<script type="module" src="./app.js"></script>
</body></html>

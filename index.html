<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164348"><meta name="description" content="傾斜測量現場紀錄、原始讀數與 A4 成果表，資料保存在本機。"><title>傾斜測量紀錄 V0.5.1</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="app-header"><div class="brand"><img src="./icon.svg" alt="" width="40" height="40"><div><h1>傾斜測量紀錄 <small>V0.5.1</small></h1><p>弘一工程 · 鑑定現場工具</p></div></div><details id="statusPanel" class="status-panel" open><summary id="statusToggle">狀態</summary><div class="status-content"><div class="header-status"><span id="saveStatus" role="status">載入本機案件…</span><span id="offlineStatus">離線準備中</span><button id="sunlightButton" title="高對比顯示；螢幕亮度請由裝置自行調整">強光：關閉</button><button id="wakeButton">螢幕常亮：準備中</button><button id="updateButton" hidden>保存並載入新版</button></div><div id="mobileNoticeSlot"></div></div></details></header>
<div class="shell"><aside class="sidebar"><nav aria-label="工作流程"><button data-tab="case" aria-label="01 案件與表頭" class="active"><span>01</span><span class="nav-full">案件與表頭</span><span class="nav-short">案件</span></button><button data-tab="facades" aria-label="02 立面參數"><span>02</span><span class="nav-full">立面參數</span><span class="nav-short">立面</span></button><button data-tab="readings" aria-label="03 測點與讀數"><span>03</span><span class="nav-full">測點與讀數</span><span class="nav-short">讀數</span></button><button data-tab="photos" aria-label="04 點位照片"><span>04</span><span class="nav-full">點位照片</span><span class="nav-short">照片</span></button><button data-tab="map" aria-label="05 平面圖標示"><span>05</span><span class="nav-full">平面圖標示</span><span class="nav-short">佈設</span></button><button data-tab="reports" aria-label="06 成果與輸出"><span>06</span><span class="nav-full">成果與輸出</span><span class="nav-short">成果</span></button></nav><section id="caseSummary" class="case-summary" aria-label="案件摘要"></section><div class="device-note" id="desktopCaseActions"><b>資料保存在此裝置</b><p>不同裝置不會同步。離開現場前，請匯出完整案件檔。</p><button data-action="export">匯出案件檔</button><button data-action="import">匯入案件檔</button><button data-action="share" id="shareCaseButton" hidden>準備分享案件檔</button><button data-action="verify-file">驗證案件檔指紋</button></div><div class="phase-note">強光模式提高對比；螢幕亮度請由裝置調整。常亮功能依裝置支援與電量狀態運作。</div></aside>
<main id="main"><div id="notice" role="status" aria-live="polite" hidden></div><div id="workspace"></div></main></div>
<input id="verifyFile" type="file" accept=".tiltsurvey,.json,application/json" hidden>
<input id="importFile" type="file" accept=".tiltsurvey,.json,application/json" hidden>
<input id="photoCapture" type="file" accept="image/*" capture="environment" hidden>
<input id="photoImport" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden>
<input id="mapImport" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>
<dialog id="actionDialog"><form method="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><label id="reasonLabel" hidden>更正原因<textarea id="dialogReason" rows="3" maxlength="1000" placeholder="請說明更正的原因"></textarea></label><div id="dialogButtons" class="button-row"></div></form></dialog>
<script type="module" src="./app.js"></script>
</body></html>
